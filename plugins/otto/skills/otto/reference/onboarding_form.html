<h2 class="sr-only">Otto onboarding form — collects agent profile details</h2>
<form class="elicit">
  <div class="elicit-header">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M11.586 2a1.5 1.5 0 0 1 1.06.44l2.914 2.914a1.5 1.5 0 0 1 .44 1.06V16.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.492-1.347L4 16.5v-13A1.5 1.5 0 0 1 5.5 2zM5.5 3a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h9a.5.5 0 0 0 .5-.5V7h-2.5A1.5 1.5 0 0 1 11 5.5V3zm7.04 10.304a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696m0-4a.5.5 0 0 1 .92.392c-.295.69-.871 1.304-1.66 1.304-.487 0-.892-.234-1.2-.574-.309.34-.713.574-1.2.574-.486 0-.892-.233-1.2-.574-.31.34-.714.574-1.2.574a.5.5 0 0 1 0-1c.212 0 .52-.18.74-.696l.034-.067a.5.5 0 0 1 .886.067c.221.516.528.696.74.696.213 0 .52-.18.74-.696l.035-.067a.5.5 0 0 1 .885.067c.22.516.527.696.74.696s.519-.18.74-.696M12 5.5a.5.5 0 0 0 .5.5h2.293L12 3.207z"/></svg>
    <span>Agent profile</span>
  </div>
  <div class="elicit-body">

    <div class="elicit-group">
      <label class="elicit-question">What's your full name?</label>
      <input type="text" class="elicit-textarea" data-name="full_name" placeholder="Jessica Martinez" style="min-height:auto; height:36px; resize:none;">
    </div>

    <div class="elicit-group">
      <label class="elicit-question">What brokerage are you with?</label>
      <input type="text" class="elicit-textarea" data-name="brokerage" placeholder="Compass Real Estate" style="min-height:auto; height:36px; resize:none;">
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div class="elicit-group" style="margin:0;">
        <label class="elicit-question">Phone number</label>
        <input type="text" class="elicit-textarea" data-name="phone" placeholder="(416) 555-1234" style="min-height:auto; height:36px; resize:none;">
      </div>
      <div class="elicit-group" style="margin:0;">
        <label class="elicit-question">Email address</label>
        <input type="text" class="elicit-textarea" data-name="email" placeholder="jessica@compass.com" style="min-height:auto; height:36px; resize:none;">
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Website (optional)</label>
      <input type="text" class="elicit-textarea" data-name="website" placeholder="jessicamartinez.com" style="min-height:auto; height:36px; resize:none;">
    </div>

    <div style="border-top:0.5px solid var(--color-border-tertiary); margin:1.5rem 0 0.5rem;"></div>

    <div class="elicit-group">
      <label class="elicit-question">What areas do you work?</label>
      <textarea class="elicit-textarea" data-name="areas" placeholder="Neighborhoods, city, region — e.g. South Austin, Travis Heights, Zilker" style="min-height:64px;"></textarea>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">Any specialties? (pick all that apply)</label>
      <div class="elicit-pills" data-name="specialties" data-multi="true">
        <button type="button" class="elicit-pill" data-value="First-time buyers">First-time buyers</button>
        <button type="button" class="elicit-pill" data-value="Luxury">Luxury</button>
        <button type="button" class="elicit-pill" data-value="Investment">Investment</button>
        <button type="button" class="elicit-pill" data-value="Relocations">Relocations</button>
        <button type="button" class="elicit-pill" data-value="Condos">Condos</button>
        <button type="button" class="elicit-pill" data-value="New construction">New construction</button>
        <button type="button" class="elicit-pill" data-value="Other" data-other>Other</button>
      </div>
      <input type="text" class="elicit-other" data-for="specialties" placeholder="What else?" hidden>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">How many years in real estate?</label>
      <input type="text" class="elicit-textarea" data-name="years" placeholder="e.g. 14" style="min-height:auto; height:36px; resize:none;">
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;">
      <div class="elicit-group" style="margin:0;">
        <label class="elicit-question" style="font-size:12px;"><i class="ti ti-brand-instagram" style="font-size:14px; vertical-align:-1px; margin-right:4px;" aria-hidden="true"></i>Instagram</label>
        <input type="text" class="elicit-textarea" data-name="instagram" placeholder="@handle" style="min-height:auto; height:36px; resize:none;">
      </div>
      <div class="elicit-group" style="margin:0;">
        <label class="elicit-question" style="font-size:12px;"><i class="ti ti-brand-facebook" style="font-size:14px; vertical-align:-1px; margin-right:4px;" aria-hidden="true"></i>Facebook</label>
        <input type="text" class="elicit-textarea" data-name="facebook" placeholder="Page URL" style="min-height:auto; height:36px; resize:none;">
      </div>
      <div class="elicit-group" style="margin:0;">
        <label class="elicit-question" style="font-size:12px;"><i class="ti ti-brand-linkedin" style="font-size:14px; vertical-align:-1px; margin-right:4px;" aria-hidden="true"></i>LinkedIn</label>
        <input type="text" class="elicit-textarea" data-name="linkedin" placeholder="Profile URL" style="min-height:auto; height:36px; resize:none;">
      </div>
    </div>

    <div style="border-top:0.5px solid var(--color-border-tertiary); margin:1.5rem 0 0.5rem;"></div>

    <div class="elicit-group">
      <label class="elicit-question">How should Otto sound when writing for you?</label>
      <div class="elicit-pills" data-name="tone" data-multi="false">
        <button type="button" class="elicit-pill" data-value="Professional & Polished"
          style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:140px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-tie" style="font-size:20px" aria-hidden="true"></i>
          <span>
            <span style="font-size:13px; font-weight:500">Professional & polished</span><br>
            <span style="font-size:11px; color:var(--color-text-tertiary)">Clean, corporate, confident</span>
          </span>
        </button>
        <button type="button" class="elicit-pill" data-value="Warm & Approachable"
          style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:140px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-heart-handshake" style="font-size:20px" aria-hidden="true"></i>
          <span>
            <span style="font-size:13px; font-weight:500">Warm & approachable</span><br>
            <span style="font-size:11px; color:var(--color-text-tertiary)">Friendly, personal, caring</span>
          </span>
        </button>
        <button type="button" class="elicit-pill" data-value="Casual & Friendly"
          style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:140px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-coffee" style="font-size:20px" aria-hidden="true"></i>
          <span>
            <span style="font-size:13px; font-weight:500">Casual & friendly</span><br>
            <span style="font-size:11px; color:var(--color-text-tertiary)">Relaxed, like texting a friend</span>
          </span>
        </button>
        <button type="button" class="elicit-pill" data-value="Luxury & Elevated"
          style="border-radius:12px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; text-align:left; min-width:140px; box-shadow:0 1px 2px rgba(0,0,0,0.04)">
          <i class="ti ti-diamond" style="font-size:20px" aria-hidden="true"></i>
          <span>
            <span style="font-size:13px; font-weight:500">Luxury & elevated</span><br>
            <span style="font-size:11px; color:var(--color-text-tertiary)">Refined, understated, premium</span>
          </span>
        </button>
      </div>
    </div>

    <div class="elicit-group">
      <label class="elicit-question">How do you sign off emails? (paste your full signature if you have one)</label>
      <textarea class="elicit-textarea" data-name="signoff" placeholder="Best,&#10;Jessica Martinez&#10;Compass Real Estate&#10;(416) 555-1234 · jessica@compass.com&#10;jessicamartinez.com" style="min-height:100px;"></textarea>
    </div>

    <div style="border-top:0.5px solid var(--color-border-tertiary); margin:1.5rem 0 0.5rem;"></div>

    <div class="elicit-group">
      <label class="elicit-question">Any standing rules Otto should always follow? (optional)</label>
      <textarea class="elicit-textarea" data-name="standing_rules" placeholder="e.g. Never use en or em dashes. Always include school catchment in listings. Don't use exclamation marks in seller emails. Sign buyer emails with 'Talk soon' instead of 'Best'. Never use the word 'nestled'." style="min-height:80px;"></textarea>
    </div>

  </div>
  <div class="elicit-footer">
    <button type="button" class="elicit-skip">Skip</button>
    <button type="button" class="elicit-submit">Set up Otto</button>
  </div>
</form>
